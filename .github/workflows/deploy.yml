name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

# GitHub Pages 是项目站点，挂在 /<repo>/ 下，且不能跑 Cloudflare 适配器。
# 仓库改名或换自定义域名时，只需要改这里（以及自定义域名场景把 SITE_BASE 改成 /）。
env:
  SITE_BASE: /Firefly/
  SITE_URL: https://goossee6.github.io/Firefly/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site (static, base = ${{ env.SITE_BASE }})
        run: pnpm run build:platform github-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist  # 纯静态产物（构建脚本已写入 .nojekyll）
          include-hidden-files: true  # Keep .nojekyll (excluded by default since v4)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5