name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

# GitHub Pages 不能跑 Cloudflare 适配器，构建走 STATIC_BUILD=1 出纯静态 dist。
#
# 站点挂载路径取决于 Pages 有没有绑自定义域名：
#   绑了自定义域名   → 站点在域名根，SITE_BASE = /，SITE_URL = https://<自定义域名>/
#   没绑，用项目站点 → 站点在 /<repo>/ 下，SITE_BASE = /Firefly/，SITE_URL = https://<user>.github.io/Firefly/
# 两者不一致时，页面引用的 /<base>/_astro/... 在线上会全部 404。
# 仓库改名时也要同步改这里。
env:
  SITE_BASE: /
  SITE_URL: https://blog4.cn3.top/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site (static, base = ${{ env.SITE_BASE }})
        run: pnpm run build:platform github-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist  # 纯静态产物（构建脚本已写入 .nojekyll）
          include-hidden-files: true  # Keep .nojekyll (excluded by default since v4)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5